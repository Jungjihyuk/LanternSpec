# v로 시작하는 태그(예: v0.1.1)를 push하면 확인 → 만들기 → PyPI 배포까지 한다.
# 토큰 없이 PyPI Trusted Publishing으로 올린다 — PyPI의 lanternspec 설정에 이 저장소 · 이 파일 · 환경 "pypi"가 등록돼 있어야 한다.
name: release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write  # PyPI가 이 워크플로를 알아보는 데 쓴다 (Trusted Publishing)
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2

      - name: 태그와 pyproject.toml 버전이 같은지
        run: |
          version="$(uv version --short)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "태그 $GITHUB_REF_NAME 와 pyproject.toml 버전 $version 이 다릅니다 — uv version 으로 맞추고 다시 태그하세요"
            exit 1
          fi

      - name: 확인 — 포맷 · 린트 · 타입 검사 · 테스트
        run: |
          uv run ruff format --check src tests
          uv run ruff check src tests
          uv run pyright
          uv run pytest

      - name: 만들기
        run: |
          uv build
          uvx twine check dist/*

      - name: PyPI에 올리기
        run: uv publish --trusted-publishing always
