# main에 push하거나 PR을 열 때마다 확인 네 가지를 돈다 — 배포는 하지 않는다 (배포는 release.yml).
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2

      - name: 확인 — 포맷 · 린트 · 타입 검사 · 테스트
        run: |
          uv run ruff format --check src tests
          uv run ruff check src tests
          uv run pyright
          uv run pytest
