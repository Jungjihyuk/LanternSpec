# ============================================================================
# enums.yaml — 문서에 적는 "정해진 선택지"(상태 · 종류 · 주제 …)의 이름과 아이콘을 모아 둔 단 하나의 파일 (SSOT)
# ============================================================================
#
# ■ 상세 설명
#
#   LanternSpec 문서의 맨 위(frontmatter)에는 아무 말이나 쓰지 않고 정해진 값 중 하나를 고르는 칸이 있다.
#   예) 부채 카드의 status: 되물음 · 아이디어의 kind: 기능 · 작업 기획서의 status: 구현
#   그 "고를 수 있는 값"의 목록이 이 파일에 있다. 목록마다 아래와 같은 이름이 붙어 있다.
#
#     문서 종류      doc_type            모든 문서의 type 칸 (idea · plan · debt …)
#     상태          idea_status         아이디어가 어디까지 왔나 (새 아이디어 → 검토 중 → 작업됨 …)
#                   work_status         작업이 어느 단계인가 (기획 → 설계 → 할 일 → 구현 → 완료)
#                   adr_status          결정 기록이 제안인가 채택인가
#                   debt_status         부채 카드를 처음 물었나, 또 물었나, 해결했나
#                   current_status      현재 상태 문서를 지금 쓰고 있나
#                   note_draft_status   학습 노트 초안이 승인을 기다리나, 반영됐나
#                   meeting_status      회의록이 초안인가 확정인가
#     유형 · 종류    idea_kind           아이디어가 기능인가 개선 · 버그 · 실험인가
#                   debt_kind           부채가 이해 · 역량 · 기술 중 무엇인가
#     주제          area                부채 카드가 어느 주제인가 (backend · frontend …)
#     그 밖         size                할 일의 크기 (S · M · L)
#                   legacy_route        기존 문서를 흡수 · 보관 · 옮기기 중 어떻게 처리할까
#
#   이 파일을 읽는 곳 — 그래서 여기만 바꾸면 모두 따라 바뀐다:
#     · lantern 명령     예) lantern debt ask 가 카드 상태를 "되물음"으로 바꾸고, 목록에 🤔 아이콘을 붙여 보여 준다
#     · 스킬 (AI 지침)   예) /l-learn 지침 글 속의 "🤔 되물음"이 설치할 때 이 파일 값으로 채워진다
#     · 템플릿 (양식)    예) 새 기획.md를 만들면 status 칸에 이 파일의 "기획"이 들어간다
#     · lantern check    문서의 칸 값이 이 목록에 있는지 검사한다 (없는 값이면 오류)
#
# ■ 적는 법
#
#   debt_status:                               ← 목록 이름 (바꾸지 않는다)
#     label: 부채 상태                         ← 사람이 읽는 목록 설명
#     applies: {debt: status}                  ← 어느 문서(type)의 어느 칸에 쓰나: debt 문서의 status 칸
#     values:                                  ← 고를 수 있는 값들
#       처음: {icon: 🌱, role: new}            ← 이름: {아이콘, 역할}
#       기타: ❔                               ← 이름: 아이콘 (역할이 필요 없는 값은 이렇게 짧게)
#
#   role(역할)은 프로그램이 그 값을 알아보는 열쇠다. 예) 프로그램은 "해결"이라는 글자 대신
#   "role이 resolved인 값"을 찾는다. 그래서 이름을 바꿔도 동작은 그대로지만, role은 고치거나 지우면 안 된다.
#
# ■ 사용법
#
#   1) 아이콘만 바꾸기 — 이 파일에서 icon을 고친 뒤, 스킬 글에도 반영되게 upgrade를 한 번 한다.
#        되물음: {icon: 🤔, role: asked_again}   →   되물음: {icon: 💬, role: asked_again}
#        $ lantern upgrade
#        (lantern 명령의 출력과 부채 현황은 upgrade 없이도 바로 바뀐다)
#
#   2) 이름 바꾸기 — 손으로 고치지 말고 명령을 쓴다. 이미 쓴 문서들의 값과 스킬 글까지 한 번에 바뀐다.
#        $ lantern enums rename debt_status 되물음 "다시 물음"
#        $ lantern enums rename work_status 구현 개발
#        (손으로만 고치면 예전 이름이 적힌 문서들이 lantern check에서 "없는 값" 오류가 난다)
#
#   3) 값 더하기 — values 아래에 한 줄 추가하면 바로 쓸 수 있다.  예) area에  mobile: 📱
#
#   4) 확인하기 — 목록 · 아이콘 · 역할을 보고, 빠진 역할이 없는지 검사한다.
#        $ lantern enums list
#        $ lantern enums list debt_status
#
#   ※ 프로젝트에서는 docs/0. 템플릿/_meta/enums.yaml 을 고친다 (이 파일은 새 프로젝트에 복사되는 기본값).
# ============================================================================

version: 1

doc_type:
  label: 문서 종류
  applies: {"*": type}
  values:
    idea: 💡
    plan: 📋
    design: 📐
    tasks: ✅
    record: 🔨
    adr: 📝
    debt: 📒
    current: 📘
    moc: 🗺
    report: 📊
    meeting: 🗣
    legacy-map: 🗂
    known-tech: 🧠
    session: 🕐
    note-draft: 📝

idea_kind:
  label: 아이디어 유형
  applies: {idea: kind}
  values:
    기능: ✨
    개선: 🔧
    버그: 🐞
    실험: 🧪
    기술 검토: 🔍

idea_status:
  label: 아이디어 상태
  applies: {idea: status}
  values:
    새 아이디어: {icon: 💭, role: new}
    검토 중: {icon: 🔍, role: reviewing}
    작업됨: {icon: 📦, role: worked}
    보류: {icon: 🗄, role: on_hold}
    버림: {icon: ❌, role: dropped}

work_status:
  label: 작업 단계
  applies: {plan: status, design: status, tasks: status, record: status}
  values:
    기획: {icon: 📋, role: plan}
    설계: {icon: 📐, role: design}
    할 일: {icon: ✅, role: tasks}
    구현: {icon: 🔨, role: build}
    완료: {icon: 🎉, role: done}
    보류: {icon: 🗄, role: on_hold}

adr_status:
  label: 결정 상태
  applies: {adr: status}
  values:
    제안: {icon: 🟡, role: proposed}
    채택: {icon: ✅, role: accepted}
    대체됨: {icon: ↩️, role: superseded}

debt_kind:
  label: 부채 종류
  applies: {debt: kind}
  values:
    이해: {icon: 🧠, role: understanding}
    역량: {icon: 🛠, role: competency}
    기술: {icon: 🧱, role: tech}

debt_status:
  label: 부채 상태
  applies: {debt: status}
  values:
    처음: {icon: 🌱, role: new}
    되물음: {icon: 🤔, role: asked_again}
    연습 중: {icon: ✍️, role: practicing}
    해결: {icon: ✅, role: resolved}

area:
  label: 주제 (카드 하나에 주제 하나)
  applies: {debt: area}
  values:
    backend: ⚙️
    frontend: 🖥
    data: 🗄
    ai: 🤖
    infra: ☁️
    기타: ❔

current_status:
  label: 현재 상태 문서 상태
  applies: {current: status, moc: status, legacy-map: status, known-tech: status, report: status, session: status}
  values:
    사용: {icon: 🟢, role: active}
    사용 안 함: {icon: ⚪, role: inactive}

note_draft_status:
  label: 학습 노트 초안 상태
  applies: {note-draft: status}
  values:
    승인 대기: {icon: ⏳, role: pending}
    반영됨: {icon: ✅, role: applied}

meeting_status:
  label: 회의록 상태
  applies: {meeting: status}
  values:
    초안: {icon: ✏️, role: draft}
    확정: {icon: ✅, role: final}

size:
  label: 할 일 크기
  applies: {}
  values:
    S: 🟢
    M: 🟡
    L: 🔴

legacy_route:
  label: 기존 문서 처리 갈래
  applies: {}
  values:
    흡수: 🧽
    보관: 🗄
    옮기기: 🚚
