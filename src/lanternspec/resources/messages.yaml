# ============================================================================
# messages.yaml — 프로그램이 말하는 글(메시지 · 만들어지는 문서의 글 · 도움말 · 파일 주석)의 번역
# ============================================================================
#
# 코드는 모든 메시지를 영어로 쓴다: msg("Document not found: {target}", target=...)
# 이 파일은 그 영어 문장을 열쇠로 언어별 번역을 둔다. 프로젝트 언어(lantern.yaml project.language)의 글이 나온다.
#   "영어 문장 그대로": {ko: "한국어 번역"}
# {name}은 프로그램이 채우는 자리다 — 번역에도 같은 자리가 있어야 한다. 글자 그대로의 중괄호는 {{ }}로 쓴다.
# 언어를 더할 때는 항목마다 그 언어 칸을 더한다. 영어 문장을 바꾸면 이 열쇠도 바꾼다 (tests/test_messages.py가 확인한다).
# ============================================================================

