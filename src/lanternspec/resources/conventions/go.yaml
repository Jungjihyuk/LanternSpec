# Go 코드 컨벤션 — 코드 크기(작음 · 중간 · 큼)에 따라 강도를 고른다. 문서 주석의 언어는 lantern.yaml의 project.comment_language(없으면 language)를 따른다.
# 글(규칙 · 메모 · 문서 주석)은 언어마다 ko: · en: 아래에 둔다 — 나머지(찾기 · 명령 · 실행기)는 모든 언어가 함께 쓴다.

language: go
label: Go
detect: [go.mod]

tools:
  package:
    name: {ko: "go 모듈"}
    note: {ko: "의존성은 go.mod로 관리하고 go.sum을 커밋한다."}
  format: {name: gofmt · goimports, command: goimports -w .}
  lint: {name: golangci-lint, command: golangci-lint run}
  typecheck:
    command: go vet ./...
    name: {ko: "Go 컴파일러 · go vet"}
  test: {name: go test, command: go test ./...}

runners:                   # 명령 앞에 붙이는 실행기 — 기존 프로젝트는 lock 파일로 알아본다 (맞는 것이 없으면 처음 것)
                           # ci: GitHub Actions에서 확인 명령을 돌리기 전에 도구 · 의존성을 준비하는 단계 (lantern install --ci)
  - name: go
    prefix: ''
    ci:
      - {uses: actions/setup-go@v7, with: {go-version-file: go.mod}}
      - {run: go install golang.org/x/tools/cmd/goimports@latest && go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest}

existing:                  # 기존 프로젝트에 이미 있는 설정 — 찾으면 이 명령을 기록만 하고 설정은 바꾸지 않는다
  format: []
  lint:
    - {name: golangci-lint, find: [.golangci.yml, .golangci.yaml, .golangci.toml], command: golangci-lint run}
  typecheck: []

docs:                      # 문서 주석 — lantern.yaml project.comment_language(없으면 language)로 고른다
  ko:
    style: godoc 주석 (선언 바로 위, 이름으로 시작하는 문장)
    example: |
      // RenameInText는 enums.yaml 글에서 값 하나의 이름을 바꾼다.
      // 목록이나 값이 없으면 ErrNotFound를 돌려준다.
      func RenameInText(text, list, old, new string) (string, error) {

levels:                    # 코드 크기별 규칙 (글)
  small:
    ko:
      lint: go vet
      typecheck: 컴파일러 기본
      type_hints: 언어가 요구 (따로 정할 것 없음)
      docs: 내보내는(대문자) 항목에 이름으로 시작하는 한 줄
      tests: go test — 핵심 동작부터
  medium:
    ko:
      lint: golangci-lint 기본 묶음 (errcheck · govet · staticcheck · unused · ineffassign)
      typecheck: 컴파일러 기본
      type_hints: 작음과 같음
      docs: 내보내는 모든 항목에 godoc 주석, 패키지마다 package 주석
      tests: go test
  large:
    ko:
      lint: 중간 + revive(내보내는 항목 주석) · gosec
      typecheck: 컴파일러 기본
      type_hints: 작음과 같음
      docs: 중간 + 공개 함수마다 실행되는 Example 함수 (go test가 돌린다)
      tests: go test + Example 함수
