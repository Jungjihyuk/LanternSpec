# ============================================================================
# names.yaml — 한국어 프로젝트에서 lantern이 읽고 쓰는 이름을 모아 둔 단 하나의 파일
# ============================================================================
#
# 코드 · 스킬은 이름을 직접 쓰지 않고 왼쪽의 키(역할)로 찾는다.
#   코드  project.names.folder("templates") → "0. 템플릿"
#   스킬  <<folder.templates>>              → "0. 템플릿"  (설치할 때 채워진다)
# 다른 언어는 locales/<언어>/names.yaml에 같은 키로 둔다. 키를 바꾸거나 빼면 코드가 깨진다.
# 이미 쓰는 프로젝트가 있으므로 이름을 바꾸는 것은 호환이 깨지는 변경이다 (CHANGELOG에 옮기는 법).

# docs/ 아래 폴더
folders:
  templates: 0. 템플릿
  ideas: 1. 아이디어
  works: 2. 작업
  archive: 2. 작업/보관
  current: 3. 현재 상태
  rules: 3. 현재 상태/규칙 · 결정 기록
  ops: 4. 운영 기록
  reports: 4. 운영 기록/보고
  past_reports: 4. 운영 기록/보고/지난 보고
  sessions: 4. 운영 기록/세션
  meetings: 4. 운영 기록/회의록
  legacy: 5. 기존 문서
  debt: 📒 부채
  debt_cards: 📒 부채/카드
  note_drafts: 📒 부채/노트 초안
  screens: 화면          # 작업 폴더 · 현재 상태 안의 화면 시안 폴더
  data: 데이터           # 현재 상태 안의 데이터 폴더

# 문서 이름 (확장자 없이) — 템플릿 이름이자, 이름이 정해진 문서의 파일 이름
docs:
  moc: 개발문서 MOC
  plan: 기획
  design: 설계
  tasks: 할 일
  record: 기록
  idea: 아이디어
  adr: ADR
  meeting: 회의록
  session: 세션 기록
  debt_card: 부채 카드
  competency_card: 역량 카드
  known_tech: 아는 기술
  unit_log: 작업 단위 기록
  legacy_map: 기존 문서 지도
  project_definition: 프로젝트 정의서
  features: 기능 목록
  architecture: 시스템 구조
  data: 데이터
  screens: 화면
  platform: 플랫폼 연동
  deploy: 배포
  api: API
  server_ops: 서버 배포 · 운영
  collab: 협업 규칙
  debt_status: 부채 현황        # 자동 생성
  principles: 개발 원칙         # 자동 생성
  report: 현황                  # 자동 생성
  no_work: 작업 없이 고친 것     # 자동 생성 (4. 운영 기록 안)
  sections_page: 보호 칸        # 자동 생성 (0. 템플릿/_meta 안)

# 할 일 줄의 칸 이름: - [ ] W-012-T02 무엇 [크기:: M] [기준:: AC-1] [먼저:: T01]
task_attrs:
  size: 크기
  criteria: 기준
  after: 먼저
  owner: 담당
  screen: 화면
  start: 시작
  finish: 완료
  start_plan: 시작 예정
  due_plan: 마감 예정

# 문서 안에서 lantern이 알아보는 표시
markers:
  unknown: ❓ 확인 필요          # 모르는 것 — 이 줄이 있는 할 일은 시작하지 않는다
  required: (필수)               # {{칸 이름 (필수)}} — 꼭 채워야 하는 빈칸
  glance: 한눈에 보기            # 문서 맨 위 > [!abstract] 칸의 제목
  changelog: 변경 기록           # 템플릿 맨 아래, 템플릿에만 있는 칸
  migrate_bin: 📦 옮기지 못한 내용  # 양식을 옮길 때 자리가 없는 내용을 모으는 칸

# 수락 기준 검사 (lantern check --epic)
acceptance:
  situation: 상황                # gwt 형식: 상황: … · 행동: … · 결과: …
  action: 행동
  result: 결과
  simple_mark: 면               # simple 형식: ~하면 ~된다 — 조건을 나타내는 말
  vague: [빠르게, 빠른, 신속, 느리지 않, 적절히, 적절한, 적당히, 쉽게, 쉬운, 편리, 편하게, 직관적, 효율적, 최적, 충분히, 충분한,
          원활, 자연스럽, 깔끔, 보기 좋, 사용자 친화, 안정적, 많은, 적은, 대부분, 일반적으로, 가능한 한, 가급적, 등등, "잘 ", 좋게,
          좋은, 향상, 개선된, 더 나은, 유연, 강력, 멋진, 합리적]
  ambiguous: [" 또는 ", 혹은, 및/또는, /또는, 필요하면, 경우에 따라, 상황에 따라, "등 "]

# 보호 칸 — lantern이 읽거나 써 넣는 칸.
#   title: 기본 제목 · docs: 이 칸이 있는 문서(위 docs의 키) · feature: 이 칸으로 하는 일 (사용자에게 그대로 보인다)
# 사람이 제목을 바꾸거나 지워도 깨지지 않는다: lantern check가 의도를 묻고,
# 답은 lantern.yaml(docs.sections · docs.unused_sections)에 남는다 (lantern sections).
sections:
  now:
    title: 지금 상황
    docs: [record, session]
    feature: 대화가 길어져 AI가 앞 내용을 요약할 때, 하던 일을 이 칸에 적어 둡니다
  past:
    title: 지난 기록
    docs: [record, session]
    feature: '"지금 상황"에서 밀려난 내용과 /l-sync가 이 작업에 연결한 커밋을 이 칸에 쌓습니다'
  schema:
    title: 스키마 변경
    docs: [record]
    feature: 커밋할 때 스키마 파일이 바뀌었으면 이 칸에 기록했는지 확인합니다
  raw:
    title: 원문
    docs: [idea]
    feature: 겹치는 아이디어를 찾을 때 이 칸에 남긴 원래 말도 비교합니다
  status_log:
    title: 상태 기록
    docs: [idea]
    feature: 아이디어 상태가 바뀔 때마다 이 칸에 한 줄씩 남깁니다
  origin:
    title: 어디서 나왔나
    docs: [debt_card]
    feature: 같은 것을 다시 물을 때마다 어디서 물었는지 이 칸에 남깁니다
  practice:
    title: 만들어 본 것
    docs: [competency_card]
    feature: 직접 만들어 본 것을 이 칸에 기록합니다
  known_list:
    title: 목록
    docs: [known_tech]
    feature: 이미 아는 기술을 이 칸에 모읍니다 (부채 후보에서 뺍니다)
  unit_log:
    title: 기록
    docs: [unit_log]
    feature: AI가 추천한 작업 단위와 사람이 고른 단위를 이 칸의 표에 남깁니다
  legacy_docs:
    title: 문서
    docs: [legacy_map]
    feature: 기존 문서마다 이 칸의 표에 한 줄씩 더합니다
